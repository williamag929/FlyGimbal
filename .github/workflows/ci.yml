name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate-python:
    name: Python — Simulation, planner, tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run path planner (simulation mode)
        run: python src/pathfinding/dubins_momentum.py --sim

      - name: Run physics simulation (headless)
        run: python src/simulation/gyrodrone_sim.py --no-plot --mission circuit

      - name: Run tests
        run: pytest tests/ -v --tb=short

  validate-docs:
    name: Docs — Check required files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check that key docs exist
        run: |
          set -e
          for f in README.md LICENSE \
                   docs/BOM.md docs/PHYSICS.md docs/ROADMAP.md docs/STRUCTURE.md \
                   docs/BUILD_GUIDE.md docs/SITL_TESTING.md docs/CONTRIBUTING.md \
                   cad/README.md src/firmware-patch/README.md \
                   cad-specs/FRAME_SPEC.md cad-specs/FLYWHEEL_SPEC.md cad-specs/GIMBAL_SPEC.md; do
            test -f "$f" || { echo "✗ missing $f"; exit 1; }
            echo "✓ $f"
          done

      - name: Check docs are UTF-8 (not UTF-16)
        run: |
          set -e
          for f in $(git ls-files '*.md'); do
            if ! iconv -f UTF-8 -t UTF-8 "$f" > /dev/null 2>&1; then
              echo "✗ $f is not UTF-8"; exit 1
            fi
          done
          echo "All Markdown files are UTF-8."
